server:
  port: 6703

spring:
  application:
    name: gift-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5337/gift_db}
    username: ${SPRING_DATASOURCE_USERNAME:birthday}
    password: ${SPRING_DATASOURCE_PASSWORD:birthday}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

clients:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:6701}
    internal-api-key: ${INTERNAL_API_KEY:local-development-internal-key}

security:
  gateway-secret: ${GATEWAY_INTERNAL_SECRET:local-development-gateway-secret}

outbox:
  publish-delay-ms: ${OUTBOX_PUBLISH_DELAY_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
