      start_period: 10s

  api-gateway:
    build:
      context: .
      dockerfile: apiGateway/Dockerfile
    environment:
      USER_SERVICE_URL: http://user-service:6701
      GROUP_SERVICE_URL: http://group-service:6702
      GIFT_SERVICE_URL: http://gift-service:6703
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:6704
      NOTIFICATION_SERVICE_URL: http://notification-service:6705
      NOTIFICATION_WS_URL: ws://notification-service:6705
      CHAT_SERVICE_URL: http://chat-service:6706
      CHAT_WS_URL: ws://chat-service:6706
      MOCK_BANK_SERVICE_URL: http://mock-bank-service:6708
      FUNDRAISER_SERVICE_URL: http://fundraiser-service:6707
      CALENDAR_SERVICE_URL: http://calendar-service:6709
      ADMIN_SERVICE_URL: http://admin-service:6710
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-at-least-32-bytes}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-local-development-gateway-secret}
    ports:
      - "6767:6767"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6767'"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    depends_on:
      user-service:
        condition: service_healthy
      group-service:
        condition: service_healthy
      gift-service:
        condition: service_healthy
      subscription-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      mock-bank-service:
        condition: service_healthy
      fundraiser-service:
        condition: service_healthy
      calendar-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy

  web-app:
    build:
      context: .
      dockerfile: webApp/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  user-db-data:
  group-db-data:
  gift-db-data:
  subscription-db-data:
  notification-db-data:
  chat-db-data:
  mock-bank-db-data:
  fundraiser-db-data:
  calendar-db-data:
  admin-db-data:
