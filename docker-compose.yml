      - "5338:5432"
    volumes:
      - subscription-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-birthday} -d subscription_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-notification:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${POSTGRES_USER:-birthday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-birthday}
    ports:
      - "5339:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-birthday} -d notification_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-chat:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: ${POSTGRES_USER:-birthday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-birthday}
    ports:
      - "5340:5432"
    volumes:
      - chat-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-birthday} -d chat_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-mock-bank:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mock_bank_db
      POSTGRES_USER: ${POSTGRES_USER:-birthday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-birthday}
    ports:
      - "5342:5432"
    volumes:
      - mock-bank-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-birthday} -d mock_bank_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-fundraiser:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fundraiser_db
      POSTGRES_USER: ${POSTGRES_USER:-birthday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-birthday}
    ports:
      - "5341:5432"
    volumes:
      - fundraiser-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-birthday} -d fundraiser_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-calendar:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: calendar_db
      POSTGRES_USER: ${POSTGRES_USER:-birthday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-birthday}
    ports:
      - "5343:5432"
    volumes:
      - calendar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-birthday} -d calendar_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-admin:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: admin_db
      POSTGRES_USER: ${POSTGRES_USER:-birthday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-birthday}
    ports:
      - "5344:5432"
    volumes:
      - admin-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-birthday} -d admin_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"

  user-service:
    build:
      context: .
      dockerfile: userService/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-birthday}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-birthday}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-at-least-32-bytes}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-3600}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-development-internal-key}
    ports:
      - "6701:6701"
    depends_on:
      postgres-user:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6701'"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  group-service:
    build:
      context: .
      dockerfile: groupService/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-group:5432/group_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-birthday}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-birthday}
      USER_SERVICE_URL: http://user-service:6701
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-development-internal-key}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-local-development-gateway-secret}
    ports:
      - "6702:6702"
    depends_on:
      postgres-group:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6702'"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  gift-service:
    build:
      context: .
      dockerfile: giftService/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-gift:5432/gift_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-birthday}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-birthday}
      USER_SERVICE_URL: http://user-service:6701
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-development-internal-key}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-local-development-gateway-secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "6703:6703"
    depends_on:
      postgres-gift:
        condition: service_healthy
      user-service:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6703'"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  subscription-service:
    build:
      context: .
      dockerfile: subscriptionService/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-subscription:5432/subscription_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-birthday}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-birthday}
      USER_SERVICE_URL: http://user-service:6701
      GROUP_SERVICE_URL: http://group-service:6702
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-development-internal-key}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-local-development-gateway-secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "6704:6704"
    depends_on:
      postgres-subscription:
        condition: service_healthy
      user-service:
        condition: service_healthy
      group-service:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6704'"]
      interval: 5s
