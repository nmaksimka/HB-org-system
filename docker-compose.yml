services:
  postgres-user:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${POSTGRES_USER:-birthday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-birthday}
    ports:
      - "5334:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-birthday} -d user_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-group:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: group_db
      POSTGRES_USER: ${POSTGRES_USER:-birthday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-birthday}
    ports:
      - "5336:5432"
    volumes:
      - group-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-birthday} -d group_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-gift:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gift_db
      POSTGRES_USER: ${POSTGRES_USER:-birthday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-birthday}
    ports:
      - "5337:5432"
    volumes:
      - gift-db-data:/var/lib/postgresql/data
    healthcheck:
