      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-birthday}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-birthday}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-local-development-gateway-secret}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-at-least-32-bytes}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "6705:6705"
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6705'"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  chat-service:
    build:
      context: .
      dockerfile: chatService/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-chat:5432/chat_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-birthday}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-birthday}
      USER_SERVICE_URL: http://user-service:6701
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-development-internal-key}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-local-development-gateway-secret}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-at-least-32-bytes}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "6706:6706"
    depends_on:
      postgres-chat:
        condition: service_healthy
      user-service:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6706'"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  mock-bank-service:
    build:
      context: .
      dockerfile: mockBankService/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-mock-bank:5432/mock_bank_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-birthday}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-birthday}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-development-internal-key}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-local-development-gateway-secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "6708:6708"
    depends_on:
      postgres-mock-bank:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6708'"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  fundraiser-service:
    build:
      context: .
      dockerfile: fundraiserService/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-fundraiser:5432/fundraiser_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-birthday}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-birthday}
      USER_SERVICE_URL: http://user-service:6701
      GIFT_SERVICE_URL: http://gift-service:6703
      MOCK_BANK_SERVICE_URL: http://mock-bank-service:6708
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-development-internal-key}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-local-development-gateway-secret}
