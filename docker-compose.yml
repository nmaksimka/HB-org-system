      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "6709:6709"
    depends_on:
      postgres-calendar:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6709'"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  admin-service:
    build:
      context: .
      dockerfile: adminService/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-admin:5432/admin_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-birthday}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-birthday}
      USER_SERVICE_URL: http://user-service:6701
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-development-internal-key}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-local-development-gateway-secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
