server:
  port: 6767

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: gift-service
          uri: ${GIFT_SERVICE_URL:http://localhost:6703}
          predicates:
            - Path=/api/v1/gifts/**,/api/v1/users/*/gifts
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:6701}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
        - id: group-service
          uri: ${GROUP_SERVICE_URL:http://localhost:6702}
          predicates:
            - Path=/api/v1/groups/**
        - id: subscription-service
          uri: ${SUBSCRIPTION_SERVICE_URL:http://localhost:6704}
          predicates:
            - Path=/api/v1/subscriptions/**
        - id: notification-websocket
          uri: ${NOTIFICATION_WS_URL:ws://localhost:6705}
          predicates:
            - Path=/ws/notifications/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:6705}
          predicates:
            - Path=/api/v1/notifications/**
        - id: chat-websocket
          uri: ${CHAT_WS_URL:ws://localhost:6706}
          predicates:
            - Path=/ws/chats/**
        - id: chat-service
          uri: ${CHAT_SERVICE_URL:http://localhost:6706}
          predicates:
            - Path=/api/v1/chats/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: ["*"]
            exposedHeaders: [X-Correlation-Id]
            allowCredentials: true

security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}
  gateway-secret: ${GATEWAY_INTERNAL_SECRET:local-development-gateway-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
