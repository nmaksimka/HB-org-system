server:
  port: 6707

spring:
  application:
    name: fundraiser-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5341/fundraiser_db}
    username: ${SPRING_DATASOURCE_USERNAME:birthday}
    password: ${SPRING_DATASOURCE_PASSWORD:birthday}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fundraiser-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

clients:
  internal-api-key: ${INTERNAL_API_KEY:local-development-internal-key}
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:6701}
  gift-service:
    url: ${GIFT_SERVICE_URL:http://localhost:6703}
  mock-bank-service:
    url: ${MOCK_BANK_SERVICE_URL:http://localhost:6708}

security:
  gateway-secret: ${GATEWAY_INTERNAL_SECRET:local-development-gateway-secret}

outbox:
  publish-delay-ms: ${OUTBOX_PUBLISH_DELAY_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
