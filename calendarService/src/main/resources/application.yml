server:
  port: 6708
spring:
  application:
    name: calendar-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5343/calendar_db}
    username: ${SPRING_DATASOURCE_USERNAME:birthday}
    password: ${SPRING_DATASOURCE_PASSWORD:birthday}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
security:
  gateway-secret: ${GATEWAY_INTERNAL_SECRET:local-development-gateway-secret}
calendar:
  encryption-key: ${CALENDAR_ENCRYPTION_KEY:local-development-calendar-key-change-me}
outbox:
  publish-delay-ms: ${OUTBOX_PUBLISH_DELAY_MS:1000}
management:
  endpoints:
    web:
      exposure:
        include: health,info
